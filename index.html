<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mellstroy Money Tycoon</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a0933;
            font-family: 'Arial', sans-serif;
        }
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #1a0933;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            max-width: 100%;
            max-height: 100%;
        }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    // Жесткий перехватчик ошибок: выведет окно alert, если код сломается
    window.onerror = function(msg, url, line) {
        alert("Критическая ошибка в коде игры!\n\nТекст: " + msg + "\nСтрока: " + line);
        return false;
    };

    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');

    var V_WIDTH = 720;
    var V_HEIGHT = 1280;

    // Состояние игры
    var money = 0;
    var clickPower = 100;
    var multiplier = 1;

    // Магазин
    var streamCount = 0;
    var streamCost = 500;
    var donateCount = 0;
    var donateCost = 2000;
    var danceCount = 0;
    var danceCost = 10000;

    var popups = [];
    var backgroundCash = []; 

    // Загрузка арта Мелстроя
    var mellstroyImg = new Image();
    mellstroyImg.src = 'mell.png'; 
    var isImgLoaded = false;
    mellstroyImg.onload = function() { isImgLoaded = true; };
    mellstroyImg.onerror = function() { isImgLoaded = false; };

    // Создаем падающие на фоне купюры
    for (var i = 0; i < 20; i++) {
        backgroundCash.push({
            x: Math.random() * V_WIDTH,
            y: Math.random() * V_HEIGHT,
            speed: Math.random() * 2 + 1,
            size: Math.random() * 15 + 15,
            angle: Math.random() * 3
        });
    }

    // Инициализация VK Bridge
    if (typeof vkBridge !== 'undefined') {
        vkBridge.send('VKWebAppInit')
            .then(function(data) { console.log('VK Bridge ок'); })
            .catch(function(error) { console.log('VK Bridge ошибка', error); });
    }

    function resize() {
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;
        var scale = Math.min(windowWidth / V_WIDTH, windowHeight / V_HEIGHT);
        canvas.width = V_WIDTH * scale;
        canvas.height = V_HEIGHT * scale;
        ctx.scale(scale, scale);
    }
    window.addEventListener('resize', resize);
    resize();

    // Клики
    function handleInGameClick(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        var vX = (clientX - rect.left) * (V_WIDTH / rect.width);
        var vY = (clientY - rect.top) * (V_HEIGHT / rect.height);

        // Клик по Мелстрою
        if (vX > 200 && vX < 520 && vY > 300 && vY < 620) {
            var earned = clickPower * multiplier;
            money += earned;
            popups.push({ x: vX, y: vY, text: "+" + earned + "$", life: 1.0 });
            return;
        }

        // Клик по магазину
        if (vX >= 40 && vX <= 680) {
            if (vY >= 700 && vY <= 810) {
                if (money >= streamCost) {
                    money -= streamCost;
                    streamCount++;
                    streamCost = Math.floor(streamCost * 1.5);
                }
            }
            if (vY >= 830 && vY <= 940) {
                if (money >= donateCost) {
                    money -= donateCost;
                    donateCount++;
                    clickPower += 50;
                    donateCost = Math.floor(donateCost * 1.5);
                }
            }
            if (vY >= 960 && vY <= 1070) {
                if (money >= danceCost && danceCount < 1) {
                    money -= danceCost;
                    danceCount++;
                    multiplier *= 2;
                }
            }
            if (vY >= 1090 && vY <= 1200) {
                showVkVideoAd();
            }
        }
    }

    window.addEventListener('mousedown', function(e) { handleInGameClick(e.clientX, e.clientY); });

    function showVkVideoAd() {
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' })
                .then(function(data) {
                    if (data.result) triggerBonus();
                })
                .catch(function(error) {
                    triggerBonus();
                });
        } else {
            triggerBonus();
        }
    }

    function triggerBonus() {
        money += 5000;
        popups.push({ x: 360, y: 460, text: "+5000$ БОНУС!", life: 1.5 });
    }

    // Пассивный доход
    setInterval(function() {
        var passive = streamCount * 5 * multiplier;
        if (passive > 0) {
            money += passive;
            popups.push({ x: 360, y: 300, text: "+" + passive + "$/сек", life: 0.8 });
        }
    }, 1000);

    // Отрисовка
    function update() {
        // Простой сплошной фиолетовый фон без тяжелых градиентов
        ctx.fillStyle = '#211138';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Падающие купюры
        ctx.fillStyle = 'rgba(76, 175, 80, 0.15)'; 
        for (var b = 0; b < backgroundCash.length; b++) {
            var cash = backgroundCash[b];
            cash.y += cash.speed;
            if (cash.y > V_HEIGHT) {
                cash.y = -30;
                cash.x = Math.random() * V_WIDTH;
            }
            ctx.fillRect(cash.x, cash.y, cash.size * 1.5, cash.size);
        }

        // Рисуем персонажа
        if (isImgLoaded) {
            ctx.drawImage(mellstroyImg, 220, 320, 280, 280);
        } else {
            ctx.fillStyle = '#1e88e5';
            ctx.beginPath(); ctx.arc(360, 460, 120, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffb74d';
            ctx.beginPath(); ctx.arc(360, 380, 65, 0, Math.PI * 2); ctx.fill();
        }

        // Текст баланса
        ctx.fillStyle = '#ffffff'; 
        ctx.font = 'bold 55px Arial'; ctx.textAlign = 'center';
        ctx.fillText("Баланс: $" + money, 360, 140);

        ctx.font = 'bold 42px Arial'; ctx.textAlign = 'left';
        ctx.fillText('Магазин улучшений', 40, 675);

        // Кнопка 1
        ctx.fillStyle = (money >= streamCost) ? '#4a148c' : '#2c134d'; 
        ctx.fillRect(40, 700, 640, 110);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Arial';
        ctx.fillText("Стрим-Трансляция (Лвл " + streamCount + ")", 70, 745);
        ctx.font = '18px Arial'; ctx.fillStyle = '#d1c4e9'; ctx.fillText("+5$/сек автоматически", 70, 780);
        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'right';
        ctx.fillText(streamCost + "$", 650, 763);

        // Кнопка 2
        ctx.fillStyle = (money >= donateCost) ? '#4a148c' : '#2c134d'; ctx.textAlign = 'left';
        ctx.fillRect(40, 830, 640, 110);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Arial';
        ctx.fillText("Донат от подписчика (Лвл " + donateCount + ")", 70, 875);
        ctx.font = '18px Arial'; ctx.fillStyle = '#d1c4e9'; ctx.fillText("+50$ к силе клика", 70, 910);
        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'right';
        ctx.fillText(donateCost + "$", 650, 893);

        // Кнопка 3
        var maxDance = (danceCount >= 1);
        ctx.fillStyle = maxDance ? '#212121' : ((money >= danceCost) ? '#4a148c' : '#2c134d'); ctx.textAlign = 'left';
        ctx.fillRect(40, 960, 640, 110);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Arial';
        ctx.fillText(maxDance ? "Легендарный танец [MAX]" : "Легендарный танец", 70, 1005);
        ctx.font = '18px Arial'; ctx.fillStyle = '#d1c4e9'; ctx.fillText("Удваивает весь доход (x2)", 70, 1040);
        if (!maxDance) {
            ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'right';
            ctx.fillText(danceCost + "$", 650, 1023);
        }

        // Кнопка 4
        ctx.fillStyle = '#00e676'; ctx.textAlign = 'left';
        ctx.fillRect(40, 1090, 640, 110);
        ctx.fillStyle = '#000000'; ctx.font = 'bold 26px Arial';
        ctx.fillText("Халявный Донат 🎥", 70, 1135);
        ctx.font = '18px Arial'; ctx.fillStyle = '#212121'; ctx.fillText("Посмотри видео — получи куш сразу", 70, 1170);
        ctx.fillStyle = '#1b5e20'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'right';
        ctx.fillText("+5000$", 650, 1153);

        // Попапы циферок
        for (var i = popups.length - 1; i >= 0; i--) {
            var pop = popups[i]; pop.y -= 2; pop.life -= 0.02;
            if(pop.life <= 0) { popups.splice(i, 1); continue; }
            ctx.save(); ctx.globalAlpha = pop.life; ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center';
            ctx.fillText(pop.text, pop.x, pop.y); ctx.restore();
        }

        requestAnimationFrame(update);
    }

    requestAnimationFrame(update);
</script>

</body>
</html>
