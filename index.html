<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mellstroy Money Tycoon</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a0933;
            font-family: 'Arial', sans-serif;
        }
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #1a0933;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            max-width: 100%;
            max-height: 100%;
        }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    window.onerror = function(msg, url, line) {
        console.log("Лог ошибки: " + msg + " на строке " + line);
        return false;
    };

    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');

    var V_WIDTH = 720;
    var V_HEIGHT = 1280;

    // Состояние игры
    var money = 0;
    var clickPower = 100; 
    var multiplier = 1;

    // Переменные для контроля рекламы
    var isAdPlaying = false; 
    var adTimer = 0; 
    var adInterval = null;

    // Список улучшений
    var upgrades = {
        donate: { name: "Донат от фаната", cost: 200, count: 0, cpc: 10, type: "click", desc: "+10$ к клику" },
        stream: { name: "Стрим-Трансляция", cost: 500, count: 0, cps: 5, type: "passive", desc: "+5$/сек авто" },
        car: { name: "Розыгрыш тачки", cost: 1500, count: 0, cpc: 80, type: "click", desc: "+80$ к клику" },
        casino: { name: "Реклама казино", cost: 4000, count: 0, cps: 40, type: "passive", desc: "+40$/сек авто" },
        watch: { name: "Золотые часы", cost: 12000, count: 0, cpc: 500, type: "click", desc: "+500$ к клику" },
        media: { name: "Своя медиасеть", cost: 35000, count: 0, cps: 300, type: "passive", desc: "+300$/сек авто" }
    };

    var upgradeKeys = ['donate', 'stream', 'car', 'casino', 'watch', 'media'];

    var popups = [];
    var backgroundCash = []; 

    // Загрузка арта Мелстроя
    var mellstroyImg = new Image();
    mellstroyImg.src = 'mell.png'; 
    var isImgLoaded = false;
    mellstroyImg.onload = function() { isImgLoaded = true; };
    mellstroyImg.onerror = function() { isImgLoaded = false; };

    // Создаем падающие на фоне купюры
    for (var i = 0; i < 20; i++) {
        backgroundCash.push({
            x: Math.random() * V_WIDTH,
            y: Math.random() * V_HEIGHT,
            speed: Math.random() * 2 + 1,
            size: Math.random() * 15 + 15
        });
    }

    // Инициализация VK Bridge
    if (typeof vkBridge !== 'undefined') {
        vkBridge.send('VKWebAppInit').catch(function(e){});
    }

    function resize() {
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;
        var scale = Math.min(windowWidth / V_WIDTH, windowHeight / V_HEIGHT);
        canvas.width = V_WIDTH * scale;
        canvas.height = V_HEIGHT * scale;
        ctx.scale(scale, scale);
    }
    window.addEventListener('resize', resize);
    resize();

    var shopYStart = 640; 
    var buttonHeight = 82; 
    var buttonGap = 13;
    var buttonWidth = 640;
    var buttonX = (V_WIDTH - buttonWidth) / 2;

    function handleInGameClick(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        var vX = (clientX - rect.left) * (V_WIDTH / rect.width);
        var vY = (clientY - rect.top) * (V_HEIGHT / rect.height);

        // Блокируем любые клики во время воспроизведения рекламы, чтобы игрок не читерил
        if (isAdPlaying) return;

        // Клик по Мелстрою
        if (vX > 200 && vX < 520 && vY > 230 && vY < 550) {
            var earned = clickPower * multiplier;
            money += earned;
            popups.push({ x: vX, y: vY, text: "+" + earned + "$", life: 1.0 });
            return;
        }

        // Клик по магазину
        if (vX >= buttonX && vX <= buttonX + buttonWidth) {
            for (var i = 0; i < upgradeKeys.length; i++) {
                var bY = shopYStart + i * (buttonHeight + buttonGap);
                if (vY >= bY && vY <= bY + buttonHeight) {
                    buyUpgrade(upgradeKeys[i]);
                    return;
                }
            }

            // Клик по кнопке рекламы
            var advBtnY = shopYStart + 6 * (buttonHeight + buttonGap);
            if (vY >= advBtnY && vY <= advBtnY + buttonHeight) {
                startAdProcess();
            }
        }
    }

    window.addEventListener('mousedown', function(e) { handleInGameClick(e.clientX, e.clientY); });

    function buyUpgrade(key) {
        var upg = upgrades[key];
        if (money >= upg.cost) {
            money -= upg.cost;
            upg.count++;
            if (upg.type === "click") {
                clickPower += upg.cpc;
            }
            upg.cost = Math.floor(upg.cost * 1.4);
        }
    }

    // Запуск процесса рекламы с таймером ожидания
    function startAdProcess() {
        if (isAdPlaying) return; // Защита от спам-кликов по кнопке
        
        isAdPlaying = true;
        adTimer = 5; // Время просмотра рекламы (5 секунд для комфортного теста)

        // Запускаем триггер официального окна рекламы VK на мобилках
        if (typeof vkBridge !== 'undefined') {
            vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'reward' }).catch(function(e){});
        }

        // Включаем визуальный таймер обратного отсчета
        adInterval = setInterval(function() {
            adTimer--;
            if (adTimer <= 0) {
                clearInterval(adInterval);
                triggerBonus(); // Выдаем куш строго после окончания времени!
            }
        }, 1000);
    }

    function triggerBonus() {
        money += 5000;
        popups.push({ x: 360, y: 390, text: "+5000$ БОНУС!", life: 1.5 });
        isAdPlaying = false; // Разблокируем игру обратно
    }

    // Таймер пассивного дохода
    setInterval(function() {
        if (isAdPlaying) return; // Пассивный доход замирает на время рекламы
        var totalPassive = 0;
        for (var key in upgrades) {
            if (upgrades[key].type === "passive") {
                totalPassive += upgrades[key].count * upgrades[key].cps;
            }
        }
        totalPassive = totalPassive * multiplier;
        if (totalPassive > 0) {
            money += totalPassive;
            popups.push({ x: 360, y: 240, text: "+" + totalPassive + "$/сек", life: 0.8 });
        }
    }, 1000);

    function update() {
        ctx.fillStyle = '#1e0f33';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Падающие купюры
        ctx.fillStyle = 'rgba(76, 175, 80, 0.12)'; 
        for (var b = 0; b < backgroundCash.length; b++) {
            var cash = backgroundCash[b];
            if (!isAdPlaying) cash.y += cash.speed; // Останавливаем фон во время рекламы
            if (cash.y > V_HEIGHT) {
                cash.y = -30;
                cash.x = Math.random() * V_WIDTH;
            }
            ctx.fillRect(cash.x, cash.y, cash.size * 1.5, cash.size);
        }

        // Рисуем персонажа
        if (isImgLoaded) {
            ctx.drawImage(mellstroyImg, 240, 250, 240, 240);
        } else {
            ctx.fillStyle = '#1e88e5';
            ctx.beginPath(); ctx.arc(360, 370, 100, 0, Math.PI * 2); ctx.fill();
        }

        // Текст баланса
        ctx.fillStyle = '#ffffff'; 
        ctx.font = 'bold 52px Arial'; ctx.textAlign = 'center';
        ctx.fillText("Баланс: $" + money, 360, 120);

        ctx.font = 'bold 36px Arial'; ctx.textAlign = 'left';
        ctx.fillText('Магазин улучшений', 40, 605);

        // Рисуем 6 кнопок улучшений
        for (var i = 0; i < upgradeKeys.length; i++) {
            var key = upgradeKeys[i];
            var upg = upgrades[key];
            var bY = shopYStart + i * (buttonHeight + buttonGap);
            var canBuy = money >= upg.cost && !isAdPlaying;

            ctx.fillStyle = canBuy ? '#4a148c' : '#271447'; 
            ctx.fillRect(buttonX, bY, buttonWidth, buttonHeight);
            ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.strokeRect(buttonX, bY, buttonWidth, buttonHeight);

            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'left';
            ctx.fillText(upg.name + " (Лвл " + upg.count + ")", buttonX + 25, bY + 33);
            ctx.font = '16px Arial'; ctx.fillStyle = '#b388ff';
            ctx.fillText(upg.desc, buttonX + 25, bY + 63);

            ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'right';
            ctx.fillText(upg.cost + "$", buttonX + buttonWidth - 25, bY + 48);
        }

        // 7-я кнопка Рекламы (Изменяется динамически, если запущена реклама)
        var advBtnY = shopYStart + 6 * (buttonHeight + buttonGap);
        
        if (isAdPlaying) {
            ctx.fillStyle = '#ff3d00'; // Меняется на красный цвет блокировки
            ctx.fillRect(buttonX, advBtnY, buttonWidth, buttonHeight);
            ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeRect(buttonX, advBtnY, buttonWidth, buttonHeight);

            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'left';
            ctx.fillText("Идет трансляция ролика... 📺", buttonX + 25, advBtnY + 33);
            ctx.font = '16px Arial'; ctx.fillStyle = '#ffccbc';
            ctx.fillText("Награда будет выдана автоматически", buttonX + 25, advBtnY + 63);
