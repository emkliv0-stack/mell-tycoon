<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mellstroy Money Tycoon</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a0933;
            font-family: 'Arial', sans-serif;
        }
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #1a0933;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    // Гарантированный датчик ошибок на случай непредвиденных сбоев
    window.onerror = function(msg, url, line) {
        alert("Датчик зафиксировал ошибку: " + msg + "\nСтрока: " + line);
        return false;
    };

    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');

    var V_WIDTH = 720;
    var V_HEIGHT = 1280;

    // Базовый баланс и экономика клика
    var money = 0;
    var clickPower = 100;
    var multiplier = 1;

    // Состояние рекламы
    var isAdPlaying = false;
    var adTimer = 0;
    var adInterval = null;

    // Переменные улучшений
    var lvlDonate = 0;   var costDonate = 200;
    var lvlStream = 0;   var costStream = 500;
    var lvlCar = 0;      var costCar = 1500;
    var lvlCasino = 0;   var costCasino = 4000;
    var lvlWatch = 0;    var costWatch = 12000;
    var lvlMedia = 0;    var costMedia = 35000;
    var danceCount = 0;  var danceCost = 10000;

    var popups = [];
    var backgroundCash = [];

    // Загрузка локальной картинки Мелстроя из твоей папки
    var mellstroyImg = new Image();
    mellstroyImg.src = 'mell.png';
    var isImgLoaded = false;
    mellstroyImg.onload = function() { isImgLoaded = true; };
    mellstroyImg.onerror = function() { isImgLoaded = false; };

    // Создаем падающие на фоне купюры при старте
    for (var i = 0; i < 20; i++) {
        backgroundCash.push({
            x: Math.random() * V_WIDTH,
            y: Math.random() * V_HEIGHT,
            speed: Math.random() * 2 + 1,
            size: Math.random() * 15 + 15
        });
    }

    function resize() {
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;
        var scale = Math.min(windowWidth / V_WIDTH, windowHeight / V_HEIGHT);
        canvas.width = V_WIDTH * scale;
        canvas.height = V_HEIGHT * scale;
        ctx.scale(scale, scale);
    }
    window.addEventListener('resize', resize);
    resize();

    // Параметры сетки магазина
    var shopYStart = 640;
    var buttonHeight = 72; 
    var buttonGap = 9;
    var buttonWidth = 640;
    var buttonX = (V_WIDTH - buttonWidth) / 2;

    function handleInGameClick(clientX, clientY) {
        var rect = canvas.getBoundingClientRect();
        var vX = (clientX - rect.left) * (V_WIDTH / rect.width);
        var vY = (clientY - rect.top) * (V_HEIGHT / rect.height);

        if (isAdPlaying) return;

        // Зона клика по Мелстрою
        if (vX > 220 && vX < 500 && vY > 240 && vY < 500) {
            var earned = clickPower * multiplier;
            money += earned;
            popups.push({ x: vX, y: vY, text: "+" + earned + "$", life: 1.0 });
            return;
        }

        if (vX >= buttonX && vX <= buttonX + buttonWidth) {
            // Кнопка 1
            if (vY >= shopYStart && vY <= shopYStart + buttonHeight) {
                if (money >= costDonate) { money -= costDonate; lvlDonate++; clickPower += 10; costDonate = Math.floor(costDonate * 1.4); }
            }
            // Кнопка 2
            if (vY >= shopYStart + 1*(buttonHeight+buttonGap) && vY <= shopYStart + 1*(buttonHeight+buttonGap) + buttonHeight) {
                if (money >= costStream) { money -= costStream; lvlStream++; costStream = Math.floor(costStream * 1.4); }
            }
            // Кнопка 3
            if (vY >= shopYStart + 2*(buttonHeight+buttonGap) && vY <= shopYStart + 2*(buttonHeight+buttonGap) + buttonHeight) {
                if (money >= costCar) { money -= costCar; lvlCar++; clickPower += 80; costCar = Math.floor(costCar * 1.4); }
            }
            // Кнопка 4
            if (vY >= shopYStart + 3*(buttonHeight+buttonGap) && vY <= shopYStart + 3*(buttonHeight+buttonGap) + buttonHeight) {
                if (money >= costCasino) { money -= costCasino; lvlCasino++; costCasino = Math.floor(costCasino * 1.4); }
            }
            // Кнопка 5
            if (vY >= shopYStart + 4*(buttonHeight+buttonGap) && vY <= shopYStart + 4*(buttonHeight+buttonGap) + buttonHeight) {
                if (money >= costWatch) { money -= costWatch; lvlWatch++; clickPower += 500; costWatch = Math.floor(costWatch * 1.4); }
            }
            // Кнопка 6
            if (vY >= shopYStart + 5*(buttonHeight+buttonGap) && vY <= shopYStart + 5*(buttonHeight+buttonGap) + buttonHeight) {
                if (money >= costMedia) { money -= costMedia; lvlMedia++; costMedia = Math.floor(costMedia * 1.4); }
            }
            // Кнопка 7: Танец Мелстроя
            if (vY >= shopYStart + 6*(buttonHeight+buttonGap) && vY <= shopYStart + 6*(buttonHeight+buttonGap) + buttonHeight) {
                if (money >= danceCost && danceCount < 1) { money -= danceCost; danceCount++; multiplier *= 2; }
            }
            // Кнопка 8: Запуск таймера рекламы
            if (vY >= shopYStart + 7*(buttonHeight+buttonGap) && vY <= shopYStart + 7*(buttonHeight+buttonGap) + buttonHeight) {
                startAdProcess();
            }
        }
    }

    window.addEventListener('mousedown', function(e) { handleInGameClick(e.clientX, e.clientY); });

    function startAdProcess() {
        if (isAdPlaying) return;
        isAdPlaying = true;
        adTimer = 5;

        adInterval = setInterval(function() {
            adTimer--;
            if (adTimer <= 0) {
                clearInterval(adInterval);
                triggerBonus();
            }
        }, 1000);
    }

    function triggerBonus() {
        money += 5000;
        popups.push({ x: 360, y: 370, text: "+5000$ БОНУС!", life: 1.5 });
        isAdPlaying = false;
    }

    // Пассивный секундный доход
    setInterval(function() {
        if (isAdPlaying) return;
        var totalPassive = (lvlStream * 5) + (lvlCasino * 40) + (lvlMedia * 300);
        totalPassive = totalPassive * multiplier;
        if (totalPassive > 0) {
            money += totalPassive;
            popups.push({ x: 360, y: 240, text: "+" + totalPassive + "$/сек", life: 0.8 });
        }
    }, 1000);

    // Функция отрисовки кнопок
    function drawBtn(y, name, desc, cost, count, color, hasMax) {
        ctx.fillStyle = color;
        ctx.fillRect(buttonX, y, buttonWidth, buttonHeight);
        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.strokeRect(buttonX, y, buttonWidth, buttonHeight);

        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'left';
        var title = hasMax ? name + " [MAX]" : name + " (Лвл " + count + ")";
        ctx.fillText(title, buttonX + 20, y + 27);
        ctx.font = '14px Arial'; ctx.fillStyle = '#b388ff';
        ctx.fillText(desc, buttonX + 20, y + 54);

        if (!hasMax) {
            ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'right';
            ctx.fillText(cost + "$", buttonX + buttonWidth - 20, y + 42);
        }
    }

    function update() {
        ctx.fillStyle = '#1e0f33';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

        // Денежный фон
        ctx.fillStyle = 'rgba(76, 175, 80, 0.12)';
        for (var b = 0; b < backgroundCash.length; b++) {
            var cash = backgroundCash[b];
            if (!isAdPlaying) cash.y += cash.speed;
            if (cash.y > V_HEIGHT) { cash.y = -30; cash.x = Math.random() * V_WIDTH; }
            ctx.fillRect(cash.x, cash.y, cash.size * 1.5, cash.size);
        }

        // Рендеринг персонажа
        if (isImgLoaded) {
            ctx.drawImage(mellstroyImg, 240, 240, 240, 240);
        } else {
            ctx.fillStyle = '#1e88e5';
            ctx.beginPath(); ctx.arc(360, 360, 100, 0, Math.PI * 2); ctx.fill();
        }

        // Текст баланса
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 52px Arial'; ctx.textAlign = 'center';
        ctx.fillText("Баланс: $" + money, 360, 120);
        ctx.font = 'bold 32px Arial'; ctx.textAlign = 'left';
        ctx.fillText('Магазин улучшений', 40, 610);

        // Прорисовка элементов магазина
        var step = buttonHeight + buttonGap;
        drawBtn(shopYStart, "Донат от фаната", "+10$ к клику", costDonate, lvlDonate, (money >= costDonate && !isAdPlaying) ? '#4a148c' : '#271447', false);
        drawBtn(shopYStart + step, "Стрим-Трансляция", "+5$/сек автоматически", costStream, lvlStream, (money >= costStream && !isAdPlaying) ? '#4a148c' : '#271447', false);
        drawBtn(shopYStart + step*2, "Розыгрыш тачки", "+80$ к клику", costCar, lvlCar, (money >= costCar && !isAdPlaying) ? '#4a148c' : '#271447', false);
        drawBtn(shopYStart + step*3, "Реклама казино", "+40$/сек автоматически", costCasino, lvlCasino, (money >= costCasino && !isAdPlaying) ? '#4a148c' : '#271447', false);
        drawBtn(shopYStart + step*4, "Золотые часы", "+500$ к клику", costWatch, lvlWatch, (money >= costWatch && !isAdPlaying) ? '#4a148c' : '#271447', false);
